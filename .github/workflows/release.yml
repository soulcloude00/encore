name: Release candidate
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libssl-dev pkg-config ripgrep
      - name: Verify release tag matches manifest
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, tomllib
          version = tomllib.load(open('Cargo.toml', 'rb'))['package']['version']
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'tag must match Cargo.toml version'
          PY
      - run: rustup show active-toolchain && rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
      - run: scripts/check.sh
      - run: cargo build --release --locked
      - run: target/release/encore --version
      - run: scripts/package.sh '${{ matrix.target }}'
      - uses: actions/upload-artifact@v4
        with:
          name: encore-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
  draft:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create draft prerelease for review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --draft --prerelease --generate-notes
